apiVersion: 1

policies:
  - orgId: 1
    receiver: default-webhook
    group_by: ["alertname", "job"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      - receiver: default-webhook
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 15m
